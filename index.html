<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常待辦</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="eyebrow">ONE THING AT A TIME</span><h1>日常待辦<span>✦</span></h1><p>把腦中的事情放下，從一件小事開始。</p></header><section class="card" aria-label="待辦清單"><form id="add-form"><label class="sr-only" for="task">新增待辦事項</label><input id="task" placeholder="接下來，想完成什麼？" maxlength="500" autocomplete="off"><button class="add" type="submit">＋ 新增</button></form><div class="toolbar"><nav aria-label="篩選待辦"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="active" aria-pressed="false">未完成</button><button data-filter="done" aria-pressed="false">已完成</button></nav><span id="count" aria-live="polite"></span></div><ul id="list"></ul><div id="empty"><div class="empty-icon">✓</div><h2>留一點空間，給接下來的事</h2><p>在上方新增第一件待辦吧。</p></div><p id="warning" role="status" hidden></p><footer>慢慢來，每完成一件都是進步。</footer></section><p class="privacy">僅儲存在這個瀏覽器 · 留給自己的小清單</p></main><script src="script.js"></script></body></html>
